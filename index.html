<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Redes</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000000;
      background: #000000 url("./fondo.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    /* Contador de Visitas Generales */
    .visits-counter {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 10px;
      backdrop-filter: blur(5px);
    }

    /* Botones transparentes estilo Instagram */
    .social-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      backdrop-filter: blur(8px);
      transition: background 0.3s, border-color 0.3s;
      cursor: pointer;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .btn-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-content i,
    .btn-content .x-logo-svg {
      width: 22px;
      height: 22px;
      font-size: 1.4rem;
      display: inline-block;
      fill: currentColor;
    }

    /* Animación de vibración */
    .social-btn:hover i,
    .social-btn:hover .x-logo-svg {
      animation: vibrate 0.3s linear infinite;
    }

    @keyframes vibrate {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Contador de Visitas a la Web -->
    <div class="visits-counter">
      👁 Visitas: <span id="visit-count">...</span>
    </div>

    <!-- Instagram -->
    <a href="https://instagram.com/s2yxne" target="_blank" class="social-btn">
      <div class="btn-content">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </div>
    </a>

    <!-- X (Twitter) -->
    <a href="https://x.com/1Yone_" target="_blank" class="social-btn">
      <div class="btn-content">
        <svg class="x-logo-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
        </svg>
        <span>X</span>
      </div>
    </a>

    <!-- Kick -->
    <a href="https://kick.com/s2yone" target="_blank" class="social-btn">
      <div class="btn-content">
        <i class="fa-solid fa-headset"></i>
        <span>Kick</span>
      </div>
    </a>

    <!-- Spotify -->
    <a href="https://open.spotify.com/user/21esyubm7t5l4qnr3ewfvv3ji" target="_blank" class="social-btn">
      <div class="btn-content">
        <i class="fa-brands fa-spotify"></i>
        <span>Spotify</span>
      </div>
    </a>
  </div>

  <!-- Carga de librerías oficiales de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // Credenciales de tu proyecto Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyC0zaRCYqWu2JhXGvxdu7mkUv_wOHP8IHA",
      authDomain: "contador-39793.firebaseapp.com",
      databaseURL: "https://contador-39793-default-rtdb.firebaseio.com",
      projectId: "contador-39793",
      storageBucket: "contador-39793.firebasestorage.app",
      messagingSenderId: "735364335099",
      appId: "1:735364335099:web:9d35e7a699991f6a00775e",
      measurementId: "G-QTGH9547S8"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const BASE_OFFSET = 344;

    // Incrementar y escuchar VISITAS
    const visitsRef = db.ref('stats/visits');
    visitsRef.transaction(current => (current || 0) + 1);
    visitsRef.on('value', snapshot => {
      const val = snapshot.val() || 0;
      document.getElementById('visit-count').innerText = val + BASE_OFFSET;
    });
  </script>

</body>
</html>
